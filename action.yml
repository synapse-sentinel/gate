name: 'Synapse Sentinel Gate'
description: 'Universal code quality gate for the Jordan ecosystem'
author: 'Jordan Partridge'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  coverage-threshold:
    description: 'Minimum test coverage percentage (0-100)'
    required: false
    default: '80'
  php-version:
    description: 'PHP version to use'
    required: false
    default: '8.3'

outputs:
  verdict:
    description: 'Gate verdict: approved, rejected, or escalate'
    value: ${{ steps.gate.outputs.verdict }}
  reason:
    description: 'Reason for the verdict'
    value: ${{ steps.gate.outputs.reason }}

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mbstring, xml, ctype, json, dom
        coverage: xdebug
        tools: composer:v2

    - name: Get Composer cache directory
      id: composer-cache-dir
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install project dependencies
      shell: bash
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Cache Gate dependencies
      uses: actions/cache@v4
      with:
        path: ${{ github.action_path }}/vendor
        key: gate-vendor-${{ hashFiles(format('{0}/composer.lock', github.action_path)) }}
        restore-keys: gate-vendor-

    - name: Install Gate
      shell: bash
      run: |
        if [ ! -d "${{ github.action_path }}/vendor" ]; then
          composer install --working-dir=${{ github.action_path }} --no-dev --prefer-dist --no-progress --no-interaction
        fi

    - name: Run Gate
      id: gate
      shell: bash
      env:
        GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
      run: |
        php ${{ github.action_path }}/gate run \
          --coverage=${{ inputs.coverage-threshold }}
