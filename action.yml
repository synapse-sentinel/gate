name: 'Synapse Sentinel Gate'
description: 'Universal code quality gate for the Jordan ecosystem'
author: 'Jordan Partridge'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  check:
    description: 'Which check to run: tests, security, syntax, or certify (all)'
    required: false
    default: 'certify'
  coverage-threshold:
    description: 'Minimum test coverage percentage (0-100)'
    required: false
    default: '80'
  php-version:
    description: 'PHP version to use'
    required: false
    default: '8.4'
  github-token:
    description: 'GitHub token for creating check runs (requires checks:write permission)'
    required: false
    default: ${{ github.token }}
  auto-merge:
    description: 'Automatically merge PR when certification passes'
    required: false
    default: 'false'
  merge-method:
    description: 'Merge method: squash, merge, or rebase'
    required: false
    default: 'squash'
  coverage-driver:
    description: 'Code coverage driver: pcov (default, faster) or xdebug'
    required: false
    default: 'pcov'
  coverage-directory:
    description: 'Directory to scan for coverage (auto-detects app/ or src/ if not specified)'
    required: false
    default: ''
  compact:
    description: 'Use compact single-line output instead of verbose'
    required: false
    default: 'false'
  coverage-comment:
    description: 'Post coverage report as PR comment'
    required: false
    default: 'true'

outputs:
  verdict:
    description: 'Gate verdict: approved, rejected, or escalate'
    value: ${{ steps.gate.outputs.verdict }}
  reason:
    description: 'Reason for the verdict'
    value: ${{ steps.gate.outputs.reason }}
  badge:
    description: 'Markdown badge for README'
    value: '[![🏆 Sentinel Certified](https://img.shields.io/github/actions/workflow/status/${{ github.repository }}/gate.yml?label=🏆%20Sentinel%20Certified&style=flat-square)](https://github.com/${{ github.repository }}/actions/workflows/gate.yml)'

runs:
  using: 'composite'
  steps:
    - name: Configure Coverage
      shell: bash
      run: |
        if [ "${{ inputs.coverage-driver }}" = "pcov" ]; then
          if [ -n "${{ inputs.coverage-directory }}" ]; then
            COVERAGE_DIR="${{ github.workspace }}/${{ inputs.coverage-directory }}"
          elif [ -d "${{ github.workspace }}/app" ]; then
            COVERAGE_DIR="${{ github.workspace }}/app"
          elif [ -d "${{ github.workspace }}/src" ]; then
            COVERAGE_DIR="${{ github.workspace }}/src"
          else
            COVERAGE_DIR="${{ github.workspace }}"
          fi
          echo "PCOV_DIRECTORY=$COVERAGE_DIR" >> $GITHUB_ENV
        fi

    - name: Setup
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mbstring, xml, ctype, json, dom
        coverage: ${{ inputs.coverage-driver }}
        tools: composer:v2
        ini-values: ${{ inputs.coverage-driver == 'pcov' && format('pcov.directory={0}', env.PCOV_DIRECTORY) || '' }}

    - name: Install
      shell: bash
      run: |
        composer config cache-files-dir ~/.composer/cache 2>/dev/null || true
        composer install --prefer-dist --no-progress --no-interaction --quiet 2>/dev/null || composer install --prefer-dist --no-progress --no-interaction
        if [ ! -d "${{ github.action_path }}/vendor" ]; then
          composer install --working-dir=${{ github.action_path }} --no-dev --prefer-dist --no-progress --no-interaction --quiet 2>/dev/null || true
        fi

    - name: Gate
      id: gate
      shell: bash
      env:
        GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        COVERAGE_COMMENT: ${{ inputs.coverage-comment }}
      run: |
        case "${{ inputs.check }}" in
          tests)
            php ${{ github.action_path }}/gate tests \
              --coverage=${{ inputs.coverage-threshold }} \
              --token=${{ inputs.github-token }}
            ;;
          security)
            php ${{ github.action_path }}/gate security \
              --token=${{ inputs.github-token }}
            ;;
          syntax)
            php ${{ github.action_path }}/gate syntax \
              --token=${{ inputs.github-token }}
            ;;
          certify|*)
            php ${{ github.action_path }}/gate certify \
              --coverage=${{ inputs.coverage-threshold }} \
              --token=${{ inputs.github-token }} \
              ${{ inputs.compact == 'true' && '--compact' || '' }}
            ;;
        esac

    - name: Auto-merge
      if: ${{ inputs.auto-merge == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        gh pr merge ${{ github.event.pull_request.number }} \
          --${{ inputs.merge-method }} \
          --delete-branch
